name: Build Linux (musl static)
run-name: Build Linux hbbs/hbbr (musl static)
on:
  workflow_dispatch:
  push:
    branches: [super-p2p]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl make
          rustup target add x86_64-unknown-linux-musl

      - name: Build hbbs and hbbr (musl static)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/hbbs target/x86_64-unknown-linux-musl/release/hbbr

      - name: Verify super-p2p changes compiled in
        run: |
          grep -q "additional_candidates" src/rendezvous_server.rs || { echo "[FAIL] passthrough missing"; exit 1; }
          grep -q "additional_candidates" libs/hbb_common/protos/rendezvous.proto || { echo "[FAIL] proto field missing"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-hbbr-musl
          path: |
            target/x86_64-unknown-linux-musl/release/hbbs
            target/x86_64-unknown-linux-musl/release/hbbr
          if-no-files-found: error
