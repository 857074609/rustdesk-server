name: Build Linux (musl static)
run-name: Build Linux hbbs/hbbr (musl static)
on:
  workflow_dispatch:
  push:
    branches: [super-p2p]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 2026-09-27: cross-building with Ubuntu's musl-gcc wrapper produced
      # DYNAMIC musl PIEs even with forced crt-static (rustc 1.98.1, flag
      # verified present in the rustc invocation via -vv), and the artifact
      # segfaulted at startup on the deploy image (alpine 3.18). Build
      # natively on a musl host instead: alpine's native toolchain defaults
      # to true static linking. CARGO_TARGET_*_LINKER=gcc overrides the
      # repo .cargo/config.toml "musl-gcc" (absent on alpine).
      - name: Build hbbs and hbbr (static, native musl container)
        run: |
          docker run --rm -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc -v "$PWD:/src" -w /src rust:1-alpine sh -c '
            set -e
            rustc --version
            apk add --no-cache perl make build-base
            cargo build --release
            file target/release/hbbs target/release/hbbr
          '

      # The workflow name promises "static": enforce it in file(1) terms.
      - name: Verify static linkage
        run: |
          file target/release/hbbs | grep -qE "statically linked|static-pie" || { echo "[FAIL] hbbs not statically linked"; exit 1; }
          file target/release/hbbr | grep -qE "statically linked|static-pie" || { echo "[FAIL] hbbr not statically linked"; exit 1; }

      # Prove the binaries actually START on the deploy base before the
      # artifact can be consumed. Crash codes: 132=SIGILL 134=SIGABRT 139=SIGSEGV.
      - name: Smoke test on alpine 3.18 (deploy base)
        run: |
          docker run --rm -v "$PWD/target/release:/bins:ro" alpine:3.18 /bin/sh -c '
            timeout 5 /bins/hbbs --help > /dev/null 2>&1; c1=$?
            timeout 5 /bins/hbbr --help > /dev/null 2>&1; c2=$?
            echo "hbbs exit=$c1 hbbr exit=$c2"
            for c in $c1 $c2; do
              if [ "$c" -eq 139 ] || [ "$c" -eq 132 ] || [ "$c" -eq 134 ]; then
                echo "[FAIL] binary crashed on alpine 3.18 (exit=$c)"
                exit 1
              fi
            done
            echo "[OK] binaries start on alpine 3.18"
          '

      - name: Verify super-p2p changes compiled in
        run: |
          grep -q "additional_candidates" src/rendezvous_server.rs || { echo "[FAIL] passthrough missing"; exit 1; }
          grep -q "additional_candidates" libs/hbb_common/protos/rendezvous.proto || { echo "[FAIL] proto field missing"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-hbbr-musl
          path: |
            target/release/hbbs
            target/release/hbbr
          if-no-files-found: error